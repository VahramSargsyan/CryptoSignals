name: Grid OSS Forward Candidate Smoke

on:
  push:
    branches:
      - smoke/grid-oss-forward-candidate-v1

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Run candidate smoke replay
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m scripts.run_grid_paper_live \
            --symbols LINKUSDT,ETHUSDT,SOLUSDT,BNBUSDT,BTCUSDT \
            --paper-start 2026-09-20T00:00:00Z \
            --profiles MID_ONLY_WIDE,MID_OSS_ATR50_TRAIL7 \
            --output-root paper_artifacts/grid_oss_candidate_smoke

      - name: Publish smoke report
        run: |
          RUN_DIR="$(find paper_artifacts/grid_oss_candidate_smoke -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "SMOKE_RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: grid-oss-forward-candidate-smoke-${{ github.run_number }}
          path: paper_artifacts/grid_oss_candidate_smoke/**
          if-no-files-found: error
          retention-days: 30
