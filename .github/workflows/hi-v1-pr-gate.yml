name: HI_V1 PR Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  hi-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted default-branch gate code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enforce HI_V1 PR telemetry
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validate_hi_v1_pr.cjs --self-test
          node .github/scripts/validate_hi_v1_pr.cjs
