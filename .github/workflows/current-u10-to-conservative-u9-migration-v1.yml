name: Current U10 to Conservative U9 Migration v1

on:
  push:
    branches:
      - research/target-universe-champion-v1
    paths:
      - "scripts/research_current_u10_to_conservative_u9_migration_v1.py"
      - ".github/workflows/current-u10-to-conservative-u9-migration-v1.yml"
      - "research/relative_rotation/2026-09-28_CURRENT_U10_TO_CONSERVATIVE_U9_MIGRATION_V1_PREREG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"
      - name: Compile
        run: python -m py_compile scripts/research_current_u10_to_conservative_u9_migration_v1.py
      - name: Run migration stress test
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_current_u10_to_conservative_u9_migration_v1 --cutoff 2026-09-28T00:00:00Z
      - name: Publish summary
        run: |
          RUN_DIR="$(find research_artifacts/current_u10_to_conservative_u9_migration_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: current-u10-to-conservative-u9-migration-v1-${{ github.run_number }}
          path: research_artifacts/current_u10_to_conservative_u9_migration_v1/**
          if-no-files-found: error
          retention-days: 90
