name: RR U10 Monthly Total Market Cap + MA v1

on:
  push:
    branches:
      - research/u10-monthly-total-marketcap-ma-v1
    paths:
      - "scripts/research_rr_u10_monthly_total_marketcap_ma_v1.py"
      - ".github/workflows/rr-u10-monthly-total-marketcap-ma-v1.yml"
      - "research/relative_rotation/2026-09-28_RR_U10_MONTHLY_TOTAL_MARKETCAP_MA_V1_PREREG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install "pandas==2.2.3" "numpy==2.1.3" websocket-client requests
          python -m pip install --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git@e6f6aaa7de439ac6e454d9b26d2760ded8dc4923
      - name: Compile
        run: python -m py_compile scripts/research_rr_u10_monthly_total_marketcap_ma_v1.py
      - name: Run monthly total market-cap stress
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_rr_u10_monthly_total_marketcap_ma_v1 --cutoff 2026-09-26T00:00:00Z
      - name: Publish summary
        run: |
          RUN_DIR="$(find research_artifacts/rr_u10_monthly_total_marketcap_ma_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: rr-u10-monthly-total-marketcap-ma-v1-${{ github.run_number }}
          path: research_artifacts/rr_u10_monthly_total_marketcap_ma_v1/**
          if-no-files-found: error
          retention-days: 90
