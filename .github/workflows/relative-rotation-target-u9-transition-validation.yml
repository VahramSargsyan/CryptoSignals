name: Relative Rotation Target U9 Transition Validation

on:
  push:
    branches:
      - patch/relative-rotation-target-u9-transition-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"

      - name: Compile
        run: |
          python -m py_compile strategies/crypto/relative_rotation/paper_live.py
          python -m py_compile scripts/run_relative_rotation_paper_live.py
          python -m py_compile scripts/send_relative_rotation_report.py

      - name: Regression tests
        run: |
          python -m unittest tests.test_relative_rotation_paper_live -v
          python -m unittest tests.test_binance_historical tests.test_binance_rest_client -v

      - name: Run transition monitor on live public Binance data
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.run_relative_rotation_paper_live --force-notify

      - name: Assert transition contract
        run: |
          RUN_DIR="$(find paper_artifacts/relative_rotation_paper_live_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          python - "$RUN_DIR/report.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding="utf-8"))
          target=["TWT","PEPE","BNB","TRX","AAVE","AVAX","FIL","ALGO","XRP"]
          sunset=["ATOM","SOL","LINK","HBAR"]
          assert p["strategy"] == "RELATIVE_ROTATION_TARGET_U9_TRANSITION_V1"
          assert p["migration_mode"] is True
          assert p["target_assets"] == target
          assert p["sunset_assets"] == sunset
          assert p["watch_assets"] == sunset
          assert p["held_asset"] == "ATOM"
          assert p["defensive_overlay_enabled"] is False
          assert p["frozen_parameters"]["monitor_pair_count"] == 78
          assert p["frozen_parameters"]["target_pair_count"] == 36
          assert len(p["latest_pair_states"]) == 78
          allowed=set(target)
          for e in p["held_events"]["armed"] + p["held_events"]["confirmed"]:
              assert e["to_asset"] in allowed, e
          for watched in p["watch_events"].values():
              for e in watched["armed"] + watched["confirmed"]:
                  assert e["to_asset"] in allowed, e
          print("TRANSITION_CONTRACT=PASS")
          PY
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: relative-rotation-target-u9-transition-validation-${{ github.run_number }}
          path: paper_artifacts/relative_rotation_paper_live_v1/**
          if-no-files-found: error
          retention-days: 30
