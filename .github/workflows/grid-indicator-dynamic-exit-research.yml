name: Grid Indicator Dynamic Exit Research

on:
  push:
    branches:
      - research/grid-indicator-filters-v1
    paths:
      - research_requests/run_grid_indicator_dynamic_exit_v1.trigger

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run dynamic-exit experiment
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m scripts.explore_grid_indicator_dynamic_exits \
            --symbols LINKUSDT,ETHUSDT,SOLUSDT,BNBUSDT,BTCUSDT \
            --history-years 6 \
            --trade-years 3
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: grid-indicator-dynamic-exits-v1
          path: research_artifacts/grid_indicator_dynamic_exits/**
          if-no-files-found: error
          retention-days: 30
