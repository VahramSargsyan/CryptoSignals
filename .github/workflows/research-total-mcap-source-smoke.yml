name: Research Total Market Cap Source Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/research-total-mcap-source-smoke.yml"
  push:
    branches:
      - research/total-mcap-sma-return-breakout-v1
    paths:
      - ".github/workflows/research-total-mcap-source-smoke.yml"

permissions:
  contents: read

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe public CoinGecko global chart export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_artifacts/total_mcap_source_smoke
          PAGE='https://www.coingecko.com/en/charts'
          STATUS="$(curl -L -sS -A 'Mozilla/5.0 (compatible; CryptoSignalsResearch/1.0)' -o research_artifacts/total_mcap_source_smoke/coingecko_charts.html -w '%{http_code}' "$PAGE")"
          echo "coingecko_http_status=$STATUS"
          test "$STATUS" = "200"
          python - <<'PY'
          from pathlib import Path
          import re, html
          p=Path("research_artifacts/total_mcap_source_smoke/coingecko_charts.html")
          raw=p.read_text(encoding="utf-8",errors="replace")
          print("html_bytes=",len(raw))
          patterns=[
              r'https?[^"\s<>]+',
              r'[^"\s<>]{0,100}(?:csv|CSV|download|market_cap_chart|global[_-]?chart)[^"\s<>]{0,180}',
          ]
          out=[]
          for pat in patterns:
              for m in re.finditer(pat, raw):
                  s=html.unescape(m.group(0))
                  if any(k in s.lower() for k in ("csv","download","market_cap","global")):
                      out.append(s)
          unique=[]
          for s in out:
              if s not in unique:
                  unique.append(s)
          Path("research_artifacts/total_mcap_source_smoke/coingecko_candidates.txt").write_text("\n".join(unique[:500]),encoding="utf-8")
          print("candidate_count=",len(unique))
          print("\n".join(unique[:80]))
          PY

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: total-mcap-source-smoke
          path: research_artifacts/total_mcap_source_smoke/**
          retention-days: 7
