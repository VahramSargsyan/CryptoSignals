name: Research Total Market Cap Source Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/research-total-mcap-source-smoke.yml"
      - "scripts/research_total_mcap_sma.py"
  push:
    branches:
      - research/total-mcap-sma-return-breakout-v1
    paths:
      - ".github/workflows/research-total-mcap-source-smoke.yml"
      - "scripts/research_total_mcap_sma.py"

permissions:
  contents: read

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public CoinGecko TOTAL market-cap CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_artifacts/total_mcap_source_smoke
          URL='https://www.coingecko.com/etl2/global_charts/usd/total_market_cap.csv'
          STATUS="$(curl -L -sS             -A 'Mozilla/5.0 (compatible; CryptoSignalsResearch/1.0)'             -o research_artifacts/total_mcap_source_smoke/total_market_cap.csv             -w '%{http_code}' "$URL")"
          echo "coingecko_csv_http_status=$STATUS"
          test "$STATUS" = "200"
          python - <<'PY'
          from pathlib import Path
          import csv
          p=Path("research_artifacts/total_mcap_source_smoke/total_market_cap.csv")
          print("bytes=",p.stat().st_size)
          with p.open(encoding="utf-8-sig",newline="") as fh:
              rows=list(csv.reader(fh))
          print("rows_including_header=",len(rows))
          print("header=",rows[0] if rows else None)
          print("first_rows=",rows[1:4])
          print("last_rows=",rows[-3:])
          PY

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: total-mcap-source-smoke
          path: research_artifacts/total_mcap_source_smoke/**
          retention-days: 7
