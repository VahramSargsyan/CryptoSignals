name: BTC SMA Legacy7 Holdout V1

on:
  push:
    branches:
      - research/btc-sma-legacy7-holdout-v1
    paths:
      - research_requests/run_btc_sma_legacy7_holdout_v1.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy7-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install "pandas==2.2.3" "evalica==0.4.2" "choix==0.4.1"

      - name: Compile
        run: |
          python -m py_compile scripts/research_btc_sma_legacy7_holdout_v1.py
          python -m py_compile tests/test_btc_sma_legacy7_holdout_v1.py

      - name: Run unit tests
        run: |
          python -m unittest tests.test_btc_sma_legacy7_holdout_v1 -v

      - name: Run legacy7 holdout
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_btc_sma_legacy7_holdout_v1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-sma-legacy7-holdout-v1
          path: research_artifacts/btc_sma_legacy7_holdout_v1/**
          if-no-files-found: warn
          retention-days: 30
