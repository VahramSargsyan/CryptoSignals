name: Grid Reinvest Runner Research

on:
  push:
    branches:
      - research/grid-reinvest-runner-v1
    paths:
      - research_requests/run_grid_reinvest_runner_v1.trigger

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Explore reinvestment and runners
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m scripts.explore_grid_reinvest_runner \
            --symbols LINKUSDT,ETHUSDT,SOLUSDT,BNBUSDT,BTCUSDT \
            --history-years 6 \
            --trade-years 3 \
            --reinvest-fractions 0,0.5,1 \
            --runner-fractions 0,0.1,0.25,0.5 \
            --exit-profiles BASE,WIDE
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: grid-reinvest-runner-v1
          path: research_artifacts/grid_reinvest_runner/**
          if-no-files-found: error
          retention-days: 30
