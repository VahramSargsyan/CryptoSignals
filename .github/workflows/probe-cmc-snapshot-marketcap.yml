name: Probe CMC Snapshot Market Cap

on:
  push:
    branches:
      - research/u10-monthly-total-marketcap-ma-v1
    paths:
      - ".github/workflows/probe-cmc-snapshot-marketcap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Next data endpoint
        run: |
          python - <<'PY'
          import json,re,urllib.request
          h={"User-Agent":"Mozilla/5.0"}
          page="https://coinmarketcap.com/historical/20240701/"
          req=urllib.request.Request(page,headers=h)
          raw=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json" crossorigin="anonymous">(.*?)</script>',raw)
          if not m: raise SystemExit("no NEXT_DATA")
          data=json.loads(m.group(1))
          build=data["buildId"]
          print("build",build,"html_len",len(raw))
          direct=f"https://coinmarketcap.com/_next/data/{build}/historical/20240701.json"
          req=urllib.request.Request(direct,headers=h)
          with urllib.request.urlopen(req,timeout=30) as resp:
              body=resp.read()
              print("direct",resp.status,"len",len(body),resp.headers.get("content-type"))
          obj=json.loads(body)
          pp=obj["pageProps"]
          print("keys",list(pp)[:20])
          print("marketCap",pp.get("globalMetrics",{}).get("marketCap"))
          PY
