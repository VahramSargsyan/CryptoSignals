name: Probe CMC Snapshot Market Cap

on:
  push:
    branches:
      - research/u10-monthly-total-marketcap-ma-v1
    paths:
      - ".github/workflows/probe-cmc-snapshot-marketcap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect historical snapshot payload
        run: |
          python - <<'PY'
          import json,re,urllib.request
          url="https://coinmarketcap.com/historical/20231031/"
          h={"User-Agent":"Mozilla/5.0"}
          raw=urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30).read().decode("utf-8","replace")
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json"[^>]*>(.*?)</script>',raw,re.S)
          data=json.loads(m.group(1))
          pp=data["props"]["pageProps"]
          print("PAGEPROPS KEYS")
          for k,v in pp.items():
              size=len(v) if hasattr(v,"__len__") else None
              print(k,type(v).__name__,size)
          print("\nTOP-LEVEL DICTS/LISTS SAMPLES")
          for k,v in pp.items():
              if isinstance(v,dict):
                  print("\nDICT",k,"keys",list(v.keys())[:100])
              elif isinstance(v,list):
                  print("\nLIST",k,"len",len(v),"first",json.dumps(v[:1])[:5000])
          print("\nRECURSIVE KEYS CONTAINING market/cap/list/quote")
          seen=0
          def walk(obj,path=""):
              global seen
              if seen>400: return
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      p=f"{path}.{k}" if path else k
                      if any(x in k.lower() for x in ["market","cap","crypto","quote","list"]):
                          print(p,type(v).__name__,str(v)[:1500].replace("\n"," "))
                          seen+=1
                      walk(v,p)
              elif isinstance(obj,list):
                  for i,v in enumerate(obj[:5]):
                      walk(v,f"{path}[{i}]")
          walk(pp)
          PY
