name: Probe CMC Snapshot Market Cap

on:
  push:
    branches:
      - research/u10-monthly-total-marketcap-ma-v1
    paths:
      - ".github/workflows/probe-cmc-snapshot-marketcap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe snapshot HTML
        run: |
          python - <<'PY'
          import re, urllib.request
          url="https://coinmarketcap.com/historical/20240701/"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as resp:
              raw=resp.read().decode("utf-8","replace")
          print("len",len(raw))
          for pat in ["totalMarketCap","total_market_cap","marketCap","__NEXT_DATA__","historical","globalMetrics"]:
              print("\nPATTERN",pat)
              count=0
              for m in re.finditer(pat,raw,re.I):
                  a=max(0,m.start()-700); b=min(len(raw),m.end()+1200)
                  print(re.sub(r"\s+"," ",raw[a:b])[:2200])
                  count+=1
                  if count>=8: break
          PY
