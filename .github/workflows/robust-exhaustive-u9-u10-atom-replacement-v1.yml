name: Robust Exhaustive U9 U10 ATOM Replacement v1

on:
  push:
    branches:
      - research/robust-exhaustive-u9-u10-atom-replacement-v1
    paths:
      - "scripts/research_robust_exhaustive_u9_u10_atom_replacement_v1.py"
      - ".github/workflows/robust-exhaustive-u9-u10-atom-replacement-v1.yml"
      - "research/relative_rotation/2026-09-28_ROBUST_EXHAUSTIVE_U9_U10_ATOM_REPLACEMENT_V1_PREREG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robust-exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"
      - name: Compile
        run: python -m py_compile scripts/research_robust_exhaustive_u9_u10_atom_replacement_v1.py
      - name: Run robust exhaustive U9/U10
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_robust_exhaustive_u9_u10_atom_replacement_v1 --cutoff 2026-09-27T00:00:00Z
      - name: Publish summary
        run: |
          RUN_DIR="$(find research_artifacts/robust_exhaustive_u9_u10_atom_replacement_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: robust-exhaustive-u9-u10-atom-replacement-v1-${{ github.run_number }}
          path: research_artifacts/robust_exhaustive_u9_u10_atom_replacement_v1/**
          if-no-files-found: error
          retention-days: 90
