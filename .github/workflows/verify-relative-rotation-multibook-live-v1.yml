name: Verify Relative Rotation MultiBook Live v1

on:
  push:
    branches:
      - patch/multibook-live-atom-link-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pandas==2.2.3"
      - name: Compile
        run: |
          python -m py_compile scripts/run_relative_rotation_paper_live.py
          python -m py_compile scripts/send_relative_rotation_report.py
      - name: Unit regressions
        run: |
          python -m unittest tests.test_relative_rotation_paper_live -v
          python -m unittest tests.test_send_relative_rotation_report -v
          python -m unittest tests.test_binance_historical tests.test_binance_rest_client -v
      - name: Live public-data multibook dry run
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m scripts.run_relative_rotation_paper_live \
            --force-notify \
            --output-root verify_artifacts/multibook_live
          RUN_DIR="$(find verify_artifacts/multibook_live -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md"
          echo "--- TELEGRAM RU ---"
          python - "$RUN_DIR/report.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding="utf-8"))
          print(p["telegram_text_ru"])
          print("position_books=", p.get("position_books"))
          print("book_events=", {
              k: {
                  "held": v["book"]["held_asset"],
                  "quantity": v["book"].get("quantity"),
                  "armed": len(v["events"]["armed"]),
                  "confirmed": len(v["events"]["confirmed"]),
                  "primary": (
                      None
                      if v["events"]["primary_confirmed"] is None
                      else v["events"]["primary_confirmed"]["to_asset"]
                  ),
              }
              for k, v in p.get("book_events", {}).items()
          })
          print("watch_assets_runtime=", list(p.get("watch_events", {}).keys()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verify-relative-rotation-multibook-live-v1-${{ github.run_number }}
          path: verify_artifacts/multibook_live/**
          if-no-files-found: error
          retention-days: 30
