name: Global Top-K Distinct V1

on:
  push:
    branches:
      - "research-run/global-topk-distinct-v1"
    paths:
      - "research_requests/global_topk_distinct_v1.trigger"

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"
      - name: Run global top-k distinct stress test
        run: python -m scripts.research_global_topk_distinct_v1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-topk-distinct-v1
          path: research_artifacts/global_topk_distinct_v1/
          if-no-files-found: error
          retention-days: 90
