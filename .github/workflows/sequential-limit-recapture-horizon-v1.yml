name: Sequential Limit Recapture Horizon V1

on:
  push:
    branches:
      - "research-run/sequential-limit-recapture-v1"
    paths:
      - "research_requests/sequential_limit_recapture_horizon_v1.trigger"

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"
      - name: Run long-horizon recapture integrity study
        run: python -m scripts.research_sequential_limit_recapture_horizon_v1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequential-limit-recapture-horizon-v1
          path: research_artifacts/sequential_limit_recapture_horizon_v1/
          if-no-files-found: error
          retention-days: 90
