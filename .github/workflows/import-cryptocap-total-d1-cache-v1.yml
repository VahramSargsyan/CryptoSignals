name: Import CRYPTOCAP TOTAL D1 Cache v1

on:
  push:
    branches:
      - patch/cache-cryptocap-total-d1-v1
    paths:
      - ".github/workflows/import-cryptocap-total-d1-cache-v1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  import-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ARTIFACT_ID: "10975563877"
      EXPECTED_DATASET_SHA256: "d0c9b3bac915e484069c6302ddce1a0b050abbb8de155e4106e39cf6e519d3ee"
      EXPECTED_ARTIFACT_SHA256: "b8d5ebfd7397bccd9024eb1e37aef243904dd429ff680b70e41bb8c45b5e69e0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch/cache-cryptocap-total-d1-v1
          fetch-depth: 0

      - name: Download exact successful research artifact
        run: |
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          echo "$EXPECTED_ARTIFACT_SHA256  artifact.zip" | sha256sum -c -
          mkdir -p extracted
          unzip -q artifact.zip -d extracted
          find extracted -type f -maxdepth 3 -print

      - name: Import and validate exact TOTAL daily cache
        run: |
          mkdir -p data/market
          SOURCE="$(find extracted -type f -name total_daily.csv | head -1)"
          test -n "$SOURCE"
          cp "$SOURCE" data/market/cryptocap_total_d1.csv
          echo "$EXPECTED_DATASET_SHA256  data/market/cryptocap_total_d1.csv" | sha256sum -c -

          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          p = Path("data/market/cryptocap_total_d1.csv")
          with p.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))

          assert len(rows) == 1398, len(rows)
          assert rows[0]["timestamp"].startswith("2022-11-29"), rows[0]["timestamp"]
          assert rows[-1]["timestamp"].startswith("2026-09-26"), rows[-1]["timestamp"]

          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          meta = {
              "dataset_id": "CRYPTOCAP_TOTAL_D1_CACHE_V1",
              "symbol": "CRYPTOCAP:TOTAL",
              "provider": "TradingView",
              "definition": "Accumulated market capitalization of top-125 cryptocurrencies from TradingView Crypto Coins Screener",
              "timeframe": "1D",
              "start": rows[0]["timestamp"],
              "end": rows[-1]["timestamp"],
              "rows": len(rows),
              "columns": list(rows[0].keys()),
              "source_run_id": 36436522995,
              "source_artifact_id": 10975563877,
              "source_artifact_sha256": "b8d5ebfd7397bccd9024eb1e37aef243904dd429ff680b70e41bb8c45b5e69e0",
              "dataset_sha256": digest,
              "source_commit": "c0b3aa4e180e46e2b973756311189803997a8a66",
              "tvdatafeed_commit": "e6f6aaa7de439ac6e454d9b26d2760ded8dc4923",
              "test_level": "GITHUB_ACTIONS_LIVE_PUBLIC_DATA_STRESS_TEST",
              "cache_policy": "Use repository cache first. Refresh externally only if requested end date is after cache end date or a documented source/semantic correction is required."
          }
          Path("data/market/cryptocap_total_d1.meta.json").write_text(
              json.dumps(meta, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(meta, indent=2))
          PY

      - name: Commit persistent cache to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/cryptocap_total_d1.csv data/market/cryptocap_total_d1.meta.json
          if git diff --cached --quiet; then
            echo "Cache already identical; nothing to commit."
            exit 0
          fi
          git commit -m "data: persist CRYPTOCAP TOTAL daily cache through 2026-09-26"
          git push origin HEAD:patch/cache-cryptocap-total-d1-v1

      - name: Verify committed cache
        run: |
          git status --short
          tail -2 data/market/cryptocap_total_d1.csv
