name: Validate CRYPTOCAP TOTAL Cache v1

on:
  push:
    branches:
      - patch/cache-cryptocap-total-d1-v1
    paths:
      - ".github/workflows/validate-cryptocap-total-cache-v1.yml"
      - "scripts/research_rr_u10_monthly_total_marketcap_ma_v1.py"
      - "data/market/cryptocap_total_d1.csv"
      - "data/market/cryptocap_total_d1.meta.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch/cache-cryptocap-total-d1-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cached-run dependencies only
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3" requests
      - name: Prove cache-first works without tvdatafeed
        run: |
          python - <<'PY'
          import hashlib
          from scripts import research_rr_u10_monthly_total_marketcap_ma_v1 as m

          frame, mode = m.load_or_fetch_tradingview_total(m.CUTOFF)
          assert mode == "REPOSITORY_CACHE", mode
          assert len(frame) == 1398, len(frame)
          assert str(frame.iloc[0]["timestamp"]).startswith("2022-11-29")
          assert str(frame.iloc[-1]["timestamp"]).startswith("2026-09-26")
          digest = hashlib.sha256(m.TOTAL_CACHE_PATH.read_bytes()).hexdigest()
          assert digest == "d0c9b3bac915e484069c6302ddce1a0b050abbb8de155e4106e39cf6e519d3ee", digest
          print("CACHE_FIRST_PASS", mode, len(frame), digest)
          PY
