name: Grid Indicator Filter Research

on:
  push:
    branches:
      - research/grid-indicator-filters-v1
    paths:
      - research_requests/run_grid_indicator_filters_v1.trigger

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run indicator-grid experiment
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m scripts.explore_grid_indicator_filters \
            --symbols LINKUSDT,ETHUSDT,SOLUSDT,BNBUSDT,BTCUSDT \
            --history-years 6 \
            --trade-years 3 \
            --exit-profiles BASE,WIDE \
            --filters NONE,RSI_OVERSOLD_30,STOCH_OVERSOLD_20,BOLLINGER_LOWER,SMA200_BULL,MACD_BULL,STOCH_BULL,CORE_BULL,DIP_IN_BULL,V2_CORE_BULL
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: grid-indicator-filters-v1
          path: research_artifacts/grid_indicator_filters/**
          if-no-files-found: error
          retention-days: 30
