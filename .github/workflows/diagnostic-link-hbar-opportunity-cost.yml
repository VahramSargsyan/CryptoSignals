name: Diagnostic LINK HBAR Opportunity Cost

on:
  push:
    branches:
      - diagnostic/link-hbar-opportunity-cost-2026-09-29
    paths:
      - ".github/workflows/diagnostic-link-hbar-opportunity-cost.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Calculate missed LINK to HBAR rotation
        run: |
          python - <<'PY'
          import requests, json, datetime as dt

          BASE="https://api.binance.com"
          def kline(symbol, start_iso):
              ts=int(dt.datetime.fromisoformat(start_iso.replace("Z","+00:00")).timestamp()*1000)
              r=requests.get(BASE+"/api/v3/klines",params={
                  "symbol":symbol,"interval":"1d","startTime":ts,"limit":2
              },timeout=20)
              r.raise_for_status()
              return r.json()[0]

          def ticker(symbol):
              r=requests.get(BASE+"/api/v3/ticker/price",params={"symbol":symbol},timeout=20)
              r.raise_for_status()
              return float(r.json()["price"])

          link_k=kline("LINKUSDT","2026-09-28T00:00:00Z")
          hbar_k=kline("HBARUSDT","2026-09-28T00:00:00Z")
          link_open=float(link_k[1]); hbar_open=float(hbar_k[1])
          link_now=ticker("LINKUSDT"); hbar_now=ticker("HBARUSDT")

          initial_link=100.0
          fee=0.001
          initial_usdt_at_open=initial_link*link_open
          hbar_qty=initial_usdt_at_open*(1-fee)/hbar_open
          hold_link_now=initial_link*link_now
          rotated_hbar_now=hbar_qty*hbar_now
          delta=rotated_hbar_now-hold_link_now
          delta_pct=rotated_hbar_now/hold_link_now-1
          link_change=link_now/link_open-1
          hbar_change=hbar_now/hbar_open-1
          relative=hbar_change-link_change

          out={
              "timestamp_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
              "execution_open_utc":"2026-09-28T00:00:00Z",
              "execution_open_armenia":"2026-09-28T04:00:00+04:00",
              "link_open":link_open,
              "hbar_open":hbar_open,
              "link_current":link_now,
              "hbar_current":hbar_now,
              "initial_link":initial_link,
              "initial_usdt_at_open":initial_usdt_at_open,
              "fee_rate":fee,
              "hbar_qty_after_model_fee":hbar_qty,
              "hold_link_value_now":hold_link_now,
              "rotated_hbar_value_now":rotated_hbar_now,
              "delta_usdt":delta,
              "delta_pct_vs_hold_link":delta_pct,
              "link_change_since_open":link_change,
              "hbar_change_since_open":hbar_change,
              "hbar_minus_link_relative_change_pp":relative*100,
          }
          print(json.dumps(out,indent=2))
          PY
