name: RR Dynamic Regime Risk V1

on:
  push:
    branches:
      - "research-run/dynamic-regime-risk-v1"
    paths:
      - "research_requests/dynamic_regime_risk_v1.trigger"

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3" "scipy==1.14.1"
      - name: Run dynamic regime RR risk test
        run: python -m scripts.research_dynamic_regime_risk_v1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-dynamic-regime-risk-v1
          path: research_artifacts/dynamic_regime_risk_v1/
          if-no-files-found: error
          retention-days: 90
