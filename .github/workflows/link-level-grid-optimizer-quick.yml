name: Level Grid Optimizer Quick Research

on:
  push:
    branches:
      - research/grid-optimizer-v1
    paths:
      - research_requests/run_grid_optimizer_quick_v1.trigger

permissions:
  contents: read

jobs:
  optimize-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run coarse optimizer
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m scripts.optimize_link_level_grid \
            --symbols LINKUSDT,ETHUSDT,SOLUSDT,BNBUSDT,BTCUSDT \
            --history-years 6 \
            --trade-years 3 \
            --validation-days 365 \
            --phases capital,exit \
            --allocation-powers 0,1,2 \
            --micro-exits 1,2,3 \
            --mid-recoveries 6,10,14 \
            --mid-target-scales 0.75,1,1.25
      - name: Upload coarse optimizer evidence
        uses: actions/upload-artifact@v4
        with:
          name: link-level-grid-optimizer-quick-v1
          path: research_artifacts/link_level_grid_optimizer/**
          if-no-files-found: error
          retention-days: 30
