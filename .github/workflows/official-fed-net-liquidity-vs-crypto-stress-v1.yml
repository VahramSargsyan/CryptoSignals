name: Official Fed Net Liquidity vs Crypto Stress V1

on:
  push:
    branches:
      - research/global-macro-risk-regime-v1
    paths:
      - research_requests/run_official_fed_net_liquidity_vs_crypto_stress_v1.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-liquidity-event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install "pandas==2.2.3" "evalica==0.4.2" "choix==0.4.1"

      - name: Compile event study
        run: |
          python -m py_compile scripts/research_official_fed_net_liquidity_vs_crypto_stress_v1.py
          python -m py_compile tests/test_official_fed_net_liquidity_vs_crypto_stress_v1.py

      - name: Run unit tests
        run: python -m unittest tests.test_official_fed_net_liquidity_vs_crypto_stress_v1 -v

      - name: Run official liquidity event study
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_official_fed_net_liquidity_vs_crypto_stress_v1

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-fed-net-liquidity-vs-crypto-stress-v1
          path: research_artifacts/official_fed_net_liquidity_vs_crypto_stress_v1/**
          if-no-files-found: warn
          retention-days: 30
