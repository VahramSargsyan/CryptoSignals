name: Probe TradingView TOTAL Daily

on:
  push:
    branches:
      - research/u10-monthly-total-marketcap-ma-v1
    paths:
      - ".github/workflows/probe-tradingview-total.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tvdatafeed
        run: |
          python -m pip install pandas websocket-client requests
          python -m pip install --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git
      - name: Fetch CRYPTOCAP TOTAL
        run: |
          python - <<'PY'
          from tvDatafeed import TvDatafeed, Interval
          tv=TvDatafeed()
          df=tv.get_hist(symbol="TOTAL",exchange="CRYPTOCAP",interval=Interval.in_daily,n_bars=1400)
          print("TYPE",type(df))
          print("ROWS",0 if df is None else len(df))
          if df is None or len(df)<1000:
              raise SystemExit("insufficient TOTAL history")
          print("HEAD")
          print(df.head().to_string())
          print("TAIL")
          print(df.tail().to_string())
          print("RANGE",df.index.min(),df.index.max())
          print("CLOSE_RANGE",df["close"].min(),df["close"].max())
          PY
