name: Level Grid Optimizer Research

on:
  workflow_dispatch:
    inputs:
      phases:
        description: Optimizer phases
        required: true
        default: capital,exit
        type: string
  push:
    branches:
      - research/grid-optimizer-v1
    paths:
      - research_requests/run_grid_optimizer_v1.trigger

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Run cross-asset optimizer
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          PHASES: ${{ inputs.phases || 'capital,exit' }}
        run: |
          python -m scripts.optimize_link_level_grid \
            --symbols LINKUSDT,ETHUSDT,SOLUSDT,BNBUSDT,BTCUSDT \
            --history-years 6 \
            --trade-years 3 \
            --validation-days 365 \
            --phases "$PHASES" \
            --allocation-powers 0,0.5,1,1.5,2,2.5,3 \
            --micro-exits 1,2,3,4 \
            --mid-recoveries 6,8,10,12,14 \
            --mid-target-scales 0.75,1,1.25

      - name: Upload optimizer evidence
        uses: actions/upload-artifact@v4
        with:
          name: link-level-grid-optimizer-v1
          path: research_artifacts/link_level_grid_optimizer/**
          if-no-files-found: error
          retention-days: 30
