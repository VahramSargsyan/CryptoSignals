name: Unconstrained U8 U10 Last-Year v1

on:
  push:
    branches:
      - research/unconstrained-u8-u10-last-year-v1
    paths:
      - "scripts/research_unconstrained_u8_u10_last_year_v1.py"
      - ".github/workflows/unconstrained-u8-u10-last-year-v1.yml"
      - "research/relative_rotation/2026-09-27_UNCONSTRAINED_U8_U10_LAST_YEAR_V1_PREREG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"
      - name: Compile
        run: python -m py_compile scripts/research_unconstrained_u8_u10_last_year_v1.py
      - name: Run exhaustive search
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_unconstrained_u8_u10_last_year_v1 --cutoff 2026-09-27T00:00:00Z
      - name: Publish summary
        run: |
          RUN_DIR="$(find research_artifacts/unconstrained_u8_u10_last_year_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: unconstrained-u8-u10-last-year-v1-${{ github.run_number }}
          path: research_artifacts/unconstrained_u8_u10_last_year_v1/**
          if-no-files-found: error
          retention-days: 90
