name: U10 Bull-Run Confound Audit v1

on:
  push:
    branches:
      - research/u10-bullrun-confound-audit-v1
    paths:
      - "scripts/research_u10_bullrun_confound_audit_v1.py"
      - ".github/workflows/u10-bullrun-confound-audit-v1.yml"
      - "research/relative_rotation/2026-09-27_U10_BULLRUN_CONFOUND_AUDIT_V1_PREREG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"
      - name: Compile
        run: python -m py_compile scripts/research_u10_bullrun_confound_audit_v1.py
      - name: Run bull-run confound audit
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_u10_bullrun_confound_audit_v1 --cutoff 2026-09-27T00:00:00Z
      - name: Publish summary
        run: |
          RUN_DIR="$(find research_artifacts/u10_bullrun_confound_audit_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: u10-bullrun-confound-audit-v1-${{ github.run_number }}
          path: research_artifacts/u10_bullrun_confound_audit_v1/**
          if-no-files-found: error
          retention-days: 90
