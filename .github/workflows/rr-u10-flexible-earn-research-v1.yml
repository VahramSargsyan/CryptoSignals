name: RR U10 Flexible Earn Research V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rr-u10-flexible-earn-research-v1.yml"
      - "scripts/research_rr_u10_binance_flexible_earn_v1.py"
      - "scripts/research_rr_u10_vs_u11_link_v1.py"
      - "integrations/binance/**"
      - "core/data/**"

permissions:
  contents: read

concurrency:
  group: rr-u10-flexible-earn-research-v1
  cancel-in-progress: false

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install "pandas==2.2.3" "numpy>=1.26"
      - name: Syntax check
        run: python -m py_compile scripts/research_rr_u10_binance_flexible_earn_v1.py
      - name: Run RR U10 Flexible Earn sensitivity
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_rr_u10_binance_flexible_earn_v1
      - name: Publish report
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$(find research_artifacts/rr_u10_binance_flexible_earn_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          test -n "$RUN_DIR"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: rr-u10-flexible-earn-v1-${{ github.run_number }}
          path: ${{ env.RUN_DIR }}/**
          if-no-files-found: error
          retention-days: 90
