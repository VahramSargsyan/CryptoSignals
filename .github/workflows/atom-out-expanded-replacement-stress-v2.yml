name: ATOM OUT Expanded Replacement Stress v2

on:
  push:
    branches:
      - research/atom-out-replacement-v1
    paths:
      - "scripts/research_atom_out_expanded_replacement_stress_v2.py"
      - ".github/workflows/atom-out-expanded-replacement-stress-v2.yml"
      - "research/relative_rotation/2026-09-27_ATOM_OUT_EXPANDED_REPLACEMENT_STRESS_V2_PREREG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"
      - name: Compile
        run: |
          python -m py_compile scripts/research_atom_out_replacement_stress_v1.py
          python -m py_compile scripts/research_atom_out_expanded_replacement_stress_v2.py
      - name: Run expanded replacement stress
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_atom_out_expanded_replacement_stress_v2 --cutoff 2026-09-27T00:00:00Z
      - name: Publish summary
        run: |
          RUN_DIR="$(find research_artifacts/atom_out_expanded_replacement_stress_v2 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: atom-out-expanded-replacement-stress-v2-${{ github.run_number }}
          path: research_artifacts/atom_out_expanded_replacement_stress_v2/**
          if-no-files-found: error
          retention-days: 90
