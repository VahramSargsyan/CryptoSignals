name: U10 Ledger + Entry Stress v1

on:
  push:
    branches:
      - research/u10-ledger-entry-stress-v1
    paths:
      - "scripts/research_u10_ledger_entry_stress_v1.py"
      - ".github/workflows/u10-ledger-entry-stress-v1.yml"
      - "research/relative_rotation/2026-09-27_U10_LEDGER_ENTRY_STRESS_V1_PREREG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"
      - name: Compile
        run: python -m py_compile scripts/research_u10_ledger_entry_stress_v1.py
      - name: Run U10 ledger and entry stress
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_u10_ledger_entry_stress_v1 --cutoff 2026-09-27T00:00:00Z --initial-usdt 10000
      - name: Publish summary
        run: |
          RUN_DIR="$(find research_artifacts/u10_ledger_entry_stress_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: u10-ledger-entry-stress-v1-${{ github.run_number }}
          path: research_artifacts/u10_ledger_entry_stress_v1/**
          if-no-files-found: error
          retention-days: 90
