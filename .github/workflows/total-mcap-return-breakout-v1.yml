name: TOTAL Market Cap Return vs Breakout V1

on:
  push:
    branches:
      - research/total-mcap-return-breakout-v1
    paths:
      - "scripts/research_total_mcap_return_breakout_v1.py"
      - "research/relative_rotation/2026-09-28_TOTAL_MCAP_RETURN_BREAKOUT_V1_PREREG.md"
      - ".github/workflows/total-mcap-return-breakout-v1.yml"
      - "data/market/cryptocap_total_d1.csv"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/research_total_mcap_return_breakout_v1.py"
      - "research/relative_rotation/2026-09-28_TOTAL_MCAP_RETURN_BREAKOUT_V1_PREREG.md"
      - ".github/workflows/total-mcap-return-breakout-v1.yml"
      - "data/market/cryptocap_total_d1.csv"

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"

      - name: Run preregistered TOTAL stress test
        run: python -m scripts.research_total_mcap_return_breakout_v1

      - name: Publish report to summary
        run: cat research_artifacts/total_mcap_return_breakout_v1/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: total-mcap-return-breakout-v1
          path: research_artifacts/total_mcap_return_breakout_v1/**
          if-no-files-found: error
          retention-days: 90
