name: Level Grid Exit Refinement Research

on:
  push:
    branches:
      - research/grid-optimizer-v1
    paths:
      - research_requests/run_grid_exit_refine_v1.trigger

permissions:
  contents: read

jobs:
  refine-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Refine exit search
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m scripts.optimize_link_level_grid \
            --symbols LINKUSDT,ETHUSDT,SOLUSDT,BNBUSDT,BTCUSDT \
            --history-years 6 \
            --trade-years 3 \
            --validation-days 365 \
            --phases exit \
            --allocation-powers 1 \
            --micro-exits 3,4,5,6 \
            --mid-recoveries 10,14,18,22 \
            --mid-target-scales 1,1.25,1.5
      - name: Upload refined exit evidence
        uses: actions/upload-artifact@v4
        with:
          name: link-level-grid-exit-refine-v1
          path: research_artifacts/link_level_grid_optimizer/**
          if-no-files-found: error
          retention-days: 30
