name: Adaptive Stress Survival V2 Diagnostic

on:
  push:
    branches:
      - research/adaptive-stress-survival-v2
    paths:
      - research_requests/run_adaptive_stress_survival_v2.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install "pandas==2.2.3" "evalica==0.4.2" "choix==0.4.1" "lifelines==0.30.3"

      - name: Compile research runners
        run: |
          python -m py_compile scripts/research_relative_rotation_graph_intelligence.py
          python -m py_compile scripts/research_defensive_low_vol_untouched.py
          python -m py_compile scripts/research_adaptive_stress_duration_v1.py
          python -m py_compile scripts/research_adaptive_stress_survival_v2.py

      - name: Run V2 unit tests
        run: python -m unittest tests.test_adaptive_stress_survival_v2 -v

      - name: Run preregistered V2 diagnostic
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_adaptive_stress_survival_v2

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-stress-survival-v2
          path: research_artifacts/adaptive_stress_survival_v2/**
          if-no-files-found: warn
          retention-days: 30
