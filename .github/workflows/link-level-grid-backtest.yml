name: LINK Level Grid Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Binance Spot symbol
        required: true
        default: LINKUSDT
        type: string
      years:
        description: Historical years to download
        required: true
        default: 3
        type: number
      allocation_preset:
        description: Capital allocation research preset
        required: true
        default: linear_depth_reserved
        type: choice
        options:
          - linear_depth_reserved
          - equal_reserved
          - historical_observed
      range_refresh_candles:
        description: How often the trailing range is refreshed
        required: true
        default: 30
        type: number
  push:
    branches:
      - feature/link-level-grid-backtest-v1
    paths:
      - research_requests/run_link_grid_backtest_v1.trigger

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"

      - name: Run LINK level-grid research backtest
        env:
          SYMBOL: ${{ inputs.symbol || 'LINKUSDT' }}
          YEARS: ${{ inputs.years || 3 }}
          ALLOCATION_PRESET: ${{ inputs.allocation_preset || 'linear_depth_reserved' }}
          RANGE_REFRESH_CANDLES: ${{ inputs.range_refresh_candles || 30 }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m scripts.run_link_level_grid_backtest \
            --symbol "$SYMBOL" \
            --years "$YEARS" \
            --allocation-preset "$ALLOCATION_PRESET" \
            --range-refresh-candles "$RANGE_REFRESH_CANDLES"

      - name: Upload backtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-level-grid-${{ inputs.symbol || 'LINKUSDT' }}-${{ inputs.allocation_preset || 'linear_depth_reserved' }}
          path: research_artifacts/link_level_grid/**
          if-no-files-found: warn
          retention-days: 30
