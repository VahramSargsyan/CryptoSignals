name: Follow-through + Equal-Capital U10 V1

on:
  push:
    branches:
      - "research-run/followthrough-equal10-v1"
    paths:
      - "research_requests/followthrough_equal10_v1.trigger"

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"
      - name: Run stress test
        run: python -m scripts.research_followthrough_equal10_v1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followthrough-equal10-v1
          path: research_artifacts/followthrough_equal10_v1/
          if-no-files-found: error
          retention-days: 90
