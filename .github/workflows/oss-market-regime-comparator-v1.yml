name: OSS Market Regime Comparator V1

on:
  push:
    branches:
      - research/global-macro-risk-regime-v1
    paths:
      - research_requests/run_oss_market_regime_comparator_v1.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oss-market-regime-comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install "pandas==2.2.3" "evalica==0.4.2" "choix==0.4.1" "yfinance==0.2.65"

      - name: Compile comparator
        run: |
          python -m py_compile scripts/research_oss_market_regime_comparator_v1.py
          python -m py_compile tests/test_oss_market_regime_comparator_v1.py

      - name: Run unit tests
        run: python -m unittest tests.test_oss_market_regime_comparator_v1 -v

      - name: Run OSS market regime comparator
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_oss_market_regime_comparator_v1

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-market-regime-comparator-v1
          path: research_artifacts/oss_market_regime_comparator_v1/**
          if-no-files-found: warn
          retention-days: 30
