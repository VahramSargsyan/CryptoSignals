name: XRP Node Interference Fork V1

on:
  push:
    branches:
      - "research-run/xrp-node-interference-fork-v1"
    paths:
      - "research_requests/xrp_node_interference_fork_v1.trigger"

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"
      - name: Run stress test
        run: python -m scripts.research_xrp_node_interference_fork_v1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xrp-node-interference-fork-v1
          path: research_artifacts/xrp_node_interference_fork_v1/
          if-no-files-found: error
          retention-days: 90
