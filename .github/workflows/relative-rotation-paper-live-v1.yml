name: Relative Rotation Paper Live v1

on:
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send an initialization/snapshot Telegram even without a new signal"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "20 0 * * *"
    - cron: "30 18 * * *"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/relative-rotation-paper-live-v1.yml"
      - "config/relative_rotation_paper_live_v1.json"
      - "scripts/run_relative_rotation_paper_live.py"
      - "scripts/send_relative_rotation_report.py"
      - "strategies/crypto/relative_rotation/**"
      - "tests/test_relative_rotation_paper_live.py"
      - "tests/test_send_relative_rotation_report.py"
  push:
    branches:
      - deploy/relative-rotation-paper-live-v1
      - main
    paths:
      - ".github/workflows/relative-rotation-paper-live-v1.yml"
      - "config/relative_rotation_paper_live_v1.json"
      - "scripts/run_relative_rotation_paper_live.py"
      - "scripts/send_relative_rotation_report.py"
      - "strategies/crypto/relative_rotation/**"
      - "tests/test_relative_rotation_paper_live.py"
      - "tests/test_send_relative_rotation_report.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: relative-rotation-paper-live-v1
  cancel-in-progress: false

jobs:
  relative-rotation-paper-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"

      - name: Run targeted unit and data-contract tests
        run: |
          python -m unittest tests.test_relative_rotation_paper_live -v
          python -m unittest tests.test_send_relative_rotation_report -v
          python -m unittest tests.test_binance_historical tests.test_binance_rest_client -v

      - name: Run relative-rotation paper-live monitor
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_NOTIFY_INPUT: ${{ inputs.force_notify }}
        run: |
          EXTRA=""
          if [ "$FORCE_NOTIFY_INPUT" = "true" ]; then
            EXTRA="--force-notify"
          fi
          python -m scripts.run_relative_rotation_paper_live $EXTRA

      - name: Publish report to job summary
        run: |
          RUN_DIR="$(find paper_artifacts/relative_rotation_paper_live_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "PAPER_RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"

      - name: Restore Telegram dedupe state
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper_state
          STATE_FILE="paper_state/relative_rotation_notification_state.json"
          printf '{"schema_version":1,"sent_event_ids":[]}\n' > "$STATE_FILE"

          ARTIFACT_ID="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=relative-rotation-notification-state&per_page=100"               --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty'
          )"

          if [ -n "$ARTIFACT_ID" ]; then
            curl -L -sS               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"               -o /tmp/rr-notification-state.zip
            unzip -q -o /tmp/rr-notification-state.zip -d paper_state
            echo "notification_state=RESTORED artifact_id=$ARTIFACT_ID"
          else
            echo "notification_state=INITIALIZED_EMPTY"
          fi

      - name: Optional Telegram notification
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          SENDER_EXTRA=""
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_EXPRESSION" = "30 18 * * *" ]; then
            SENDER_EXTRA="--evening-confirmed-reminder"
          fi
          python -m scripts.send_relative_rotation_report             --report-json "$PAPER_RUN_DIR/report.json"             --notification-text "$PAPER_RUN_DIR/notification.txt"             --state-file "paper_state/relative_rotation_notification_state.json"             $SENDER_EXTRA

      - name: Persist Telegram dedupe state
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: relative-rotation-notification-state
          path: paper_state/relative_rotation_notification_state.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload paper evidence
        uses: actions/upload-artifact@v4
        with:
          name: relative-rotation-paper-live-v1-${{ github.run_number }}
          path: paper_artifacts/relative_rotation_paper_live_v1/**
          if-no-files-found: error
          retention-days: 90
