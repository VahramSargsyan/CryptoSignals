name: Combined Recovery State V2

on:
  push:
    branches:
      - research/combined-recovery-state-v2
    paths:
      - research_requests/run_combined_recovery_state_v2.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-recovery-state-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install "pandas==2.2.3" "evalica==0.4.2" "choix==0.4.1"

      - name: Compile
        run: |
          python -m py_compile scripts/research_combined_recovery_state_v2.py
          python -m py_compile tests/test_combined_recovery_state_v2.py

      - name: Unit tests
        run: |
          python -m unittest tests.test_combined_recovery_state_v2 -v

      - name: Run combined recovery state V2
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_combined_recovery_state_v2

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-recovery-state-v2
          path: research_artifacts/combined_recovery_state_v2/**
          if-no-files-found: warn
          retention-days: 30
