name: Telegram Secret Smoke Test

on:
  push:
    branches:
      - ops/telegram-secret-smoke-v1
    paths:
      - ops_requests/telegram_smoke.trigger

permissions:
  contents: read

jobs:
  telegram-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build one-shot test report
        run: |
          mkdir -p /tmp/grid-telegram-smoke
          cat > /tmp/grid-telegram-smoke/report.json <<'JSON'
          {
            "should_notify": true,
            "latest_closed_candle": null,
            "completed_paper_candles": 0,
            "milestone": "TELEGRAM_SMOKE_TEST"
          }
          JSON
          cat > /tmp/grid-telegram-smoke/notification.txt <<'TXT'
          CryptoSignals Telegram test ✅
          GitHub Actions successfully reached your Telegram bot.
          Grid Paper Live v1 is configured for paper-only reporting.
          TXT
      - name: Send Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scripts.send_grid_paper_report             --report-json /tmp/grid-telegram-smoke/report.json             --notification-text /tmp/grid-telegram-smoke/notification.txt
