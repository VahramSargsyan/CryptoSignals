name: SOL XRP Holdout V1

on:
  push:
    branches:
      - "research-run/sol-xrp-holdout-v1"
    paths:
      - "research_requests/sol_xrp_holdout_v1.trigger"

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"

      - name: Run SOL vs XRP pre-PEPE holdout
        run: python -m scripts.research_sol_xrp_holdout_v1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-xrp-holdout-v1
          path: research_artifacts/sol_xrp_holdout_v1/
          if-no-files-found: error
          retention-days: 90
