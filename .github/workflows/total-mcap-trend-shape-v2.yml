name: TOTAL Market Cap Trend Shape V2

on:
  push:
    branches:
      - research/total-mcap-return-breakout-v1
    paths:
      - "scripts/research_total_mcap_trend_shape_v2.py"
      - "research/relative_rotation/2026-09-28_TOTAL_MCAP_TREND_SHAPE_V2_PREREG.md"
      - ".github/workflows/total-mcap-trend-shape-v2.yml"
      - "data/market/cryptocap_total_d1.csv"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/research_total_mcap_trend_shape_v2.py"
      - "research/relative_rotation/2026-09-28_TOTAL_MCAP_TREND_SHAPE_V2_PREREG.md"
      - ".github/workflows/total-mcap-trend-shape-v2.yml"
      - "data/market/cryptocap_total_d1.csv"

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3"
      - name: Run V2 stress test
        run: python -m scripts.research_total_mcap_trend_shape_v2
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: total-mcap-trend-shape-v2
          path: research_artifacts/total_mcap_trend_shape_v2/**
          if-no-files-found: error
          retention-days: 90
