name: Relative Rotation U10 ATOM Watch Validation

on:
  push:
    branches:
      - patch/relative-rotation-live-u10-atom-watch-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install "pandas==2.2.3"

      - name: Compile changed monitor
        run: |
          python -m py_compile strategies/crypto/relative_rotation/paper_live.py
          python -m py_compile scripts/run_relative_rotation_paper_live.py
          python -m py_compile scripts/send_relative_rotation_report.py

      - name: Run targeted regression tests
        run: |
          python -m unittest tests.test_relative_rotation_paper_live -v
          python -m unittest tests.test_binance_historical tests.test_binance_rest_client -v

      - name: Run U10 monitor against live public Binance data
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.run_relative_rotation_paper_live --force-notify

      - name: Assert U10 production contract
        run: |
          RUN_DIR="$(find paper_artifacts/relative_rotation_paper_live_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          python - "$RUN_DIR/report.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding="utf-8"))
          assert p["strategy"] == "RELATIVE_ROTATION_GRAPH_10_V1", p["strategy"]
          assert p["frozen_parameters"]["assets"] == ["ATOM","TWT","PEPE","BNB","SOL","TRX","AAVE","LINK","FIL","HBAR"]
          assert p["frozen_parameters"]["pair_count"] == 45
          assert p["watch_assets"] == ["ATOM"]
          assert len(p["latest_pair_states"]) == 45
          assert p["held_asset"] == "ATOM"
          print("U10_CONTRACT=PASS")
          PY
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: relative-rotation-u10-atom-watch-validation-${{ github.run_number }}
          path: paper_artifacts/relative_rotation_paper_live_v1/**
          if-no-files-found: error
          retention-days: 30
