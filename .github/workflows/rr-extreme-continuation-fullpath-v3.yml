name: RR Extreme Continuation Full-Path v3

on:
  push:
    branches:
      - research/rr-extreme-continuation-fullpath-v3
    paths:
      - "scripts/research_rr_extreme_continuation_fullpath_v3.py"
      - ".github/workflows/rr-extreme-continuation-fullpath-v3.yml"
      - "research/relative_rotation/2026-10-03_RR_EXTREME_CONTINUATION_FULLPATH_V3_PREREG.md"
      - "scripts/research_rr_ddg_acceleration_fork_v1.py"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/research_rr_extreme_continuation_fullpath_v3.py"
      - ".github/workflows/rr-extreme-continuation-fullpath-v3.yml"
      - "research/relative_rotation/2026-10-03_RR_EXTREME_CONTINUATION_FULLPATH_V3_PREREG.md"
      - "scripts/research_rr_ddg_acceleration_fork_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3" requests
      - name: Compile
        run: python -m py_compile scripts/research_rr_extreme_continuation_fullpath_v3.py
      - name: Run RR extreme continuation full-path v3
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_rr_extreme_continuation_fullpath_v3
      - name: Publish summary
        run: |
          RUN_DIR="$(find research_artifacts/rr_extreme_continuation_fullpath_v3 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: rr-extreme-continuation-fullpath-v3-${{ github.run_number }}
          path: research_artifacts/rr_extreme_continuation_fullpath_v3/**
          if-no-files-found: error
          retention-days: 90
