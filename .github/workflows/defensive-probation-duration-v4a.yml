name: Defensive Probation Duration V4A Research

on:
  push:
    branches:
      - research/defensive-probation-duration-robustness-v4a
    paths:
      - research_requests/run_defensive_probation_duration_v4a.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies
        run: |
          python -m pip install "pandas==2.2.3" "evalica==0.4.2" "choix==0.4.1"

      - name: Compile research runners
        run: |
          python -m py_compile scripts/research_relative_rotation_graph_intelligence.py
          python -m py_compile scripts/research_defensive_low_vol_untouched.py
          python -m py_compile scripts/research_defensive_shadow_reentry_v2.py
          python -m py_compile scripts/research_defensive_probation_memory_v4.py
          python -m py_compile scripts/research_defensive_probation_duration_v4a.py

      - name: Run V4 memory unit tests
        run: python -m unittest tests.test_defensive_probation_memory_v4 -v

      - name: Run preregistered V4A robustness sweep
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_defensive_probation_duration_v4a

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defensive-probation-duration-v4a
          path: research_artifacts/defensive_probation_duration_v4a/**
          if-no-files-found: warn
          retention-days: 30
