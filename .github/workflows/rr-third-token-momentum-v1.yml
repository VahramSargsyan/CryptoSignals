name: RR Third Token Momentum v1

on:
  push:
    branches:
      - research/rr-third-token-momentum-v1
    paths:
      - "scripts/research_rr_third_token_momentum_v1.py"
      - ".github/workflows/rr-third-token-momentum-v1.yml"
      - "research/relative_rotation/2026-10-03_RR_THIRD_TOKEN_MOMENTUM_V1_PREREG.md"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/research_rr_third_token_momentum_v1.py"
      - ".github/workflows/rr-third-token-momentum-v1.yml"
      - "research/relative_rotation/2026-10-03_RR_THIRD_TOKEN_MOMENTUM_V1_PREREG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pandas==2.2.3" "numpy==2.1.3" requests
      - name: Compile
        run: python -m py_compile scripts/research_rr_third_token_momentum_v1.py
      - name: Run third-token momentum stress test
        env:
          SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: python -m scripts.research_rr_third_token_momentum_v1
      - name: Publish summary
        run: |
          RUN_DIR="$(find research_artifacts/rr_third_token_momentum_v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          cat "$RUN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: rr-third-token-momentum-v1-${{ github.run_number }}
          path: research_artifacts/rr_third_token_momentum_v1/**
          if-no-files-found: error
          retention-days: 90
